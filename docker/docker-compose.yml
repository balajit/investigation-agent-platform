version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iap
      POSTGRES_USER: iap
      POSTGRES_PASSWORD: iap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  temporal:
    image: temporalio/auto-setup:1.23
    ports:
      - "7233:7233"
      - "8233:8233"  # UI
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=iap
      - POSTGRES_PWD=iap
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      - postgres

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092

  # Part 6 Slice 2 + Layer 3: single shared Neo4j 5.26 Community instance.
  # Graphiti (group_id namespacing) and Layer 3 topology (label namespaces)
  # share one database — Community allows exactly one. See docs
  # (part-6 design, ISSUE-4) for the Enterprise/Aura upgrade trigger.
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"  # browser
      - "7687:7687"  # bolt
    environment:
      - NEO4J_AUTH=neo4j/iap-neo4j-dev
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neodat:/data
      - neologs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "iap-neo4j-dev", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  neodat:
  neologs:
