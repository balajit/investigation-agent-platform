services:
  postgres:
    # pgvector image (Part 6 D2): Mem0's vector substrate lives on this same
    # database via CREATE EXTENSION vector (migration 006_pgvector_extension).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: iap
      POSTGRES_USER: iap
      POSTGRES_PASSWORD: iap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  temporal:
    image: temporalio/auto-setup:1.23
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=iap
      - POSTGRES_PWD=iap
      # Image only ships config/dynamicconfig/docker.yaml (empty); the
      # previously referenced development-sql.yaml doesn't exist in the
      # image and isn't mounted, which caused the container to fail on
      # every start ("no such file or directory").
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/docker.yaml
    depends_on:
      - postgres

  # auto-setup doesn't bundle the Web UI — it's a separate image that talks
  # to the frontend gRPC port above. This is what actually serves :8233.
  temporal-ui:
    image: temporalio/ui:2.31.2
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  kafka:
    image: bitnamilegacy/kafka:3.7 
    ports:
      - "9093:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT


  # Part 6 Slice 2 + Layer 3: single shared Neo4j 5.26 Community instance.
  # Graphiti (group_id namespacing) and Layer 3 topology (label namespaces)
  # share one database — Community allows exactly one. See docs
  # (part-6 design, ISSUE-4) for the Enterprise/Aura upgrade trigger.
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"  # browser
      - "7687:7687"  # bolt
    environment:
      - NEO4J_AUTH=neo4j/iap-neo4j-dev
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neodat:/data
      - neologs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "iap-neo4j-dev", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  neodat:
  neologs:
