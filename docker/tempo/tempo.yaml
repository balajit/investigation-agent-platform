# docker/tempo/tempo.yaml — minimal Tempo for IAP dev traces (#10).
# OTLP gRPC in, local filesystem store, TraceQL + UI out. Dev only:
# retention is short and the volume is disposable.
server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 4
      queue_depth: 100

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s
