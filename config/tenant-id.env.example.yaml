# Safe synthetic offline capture example. Not accepted by a server endpoint yet.
schema_version: tenant-intake/v1
application_id: example-application
environment: staging
repositories:
  - provider_key: sample-git-host
    repository_id: example-team/example-service
    ref: refs/heads/main
sources:
  - source_kind: datasource
    provider_key: sample-database-provider
    resource_id: cluster-example/database-example
    access_mode: READ_ONLY
    secret_references:
      - provider: manager
        name: EXAMPLE_DATABASE_READ_ONLY
        access_mode: READ_ONLY
