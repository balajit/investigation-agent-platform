[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investigation-agent-platform"
version = "0.1.0"
description = "Agentic investigation platform to investigate system issues"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "pyyaml>=6.0",
    "rustworkx>=0.18.1",
    "elasticsearch>=9.5.1",
    "sqlglot>=30.18.0",
    "pygit2>=1.20.1",
    "tenacity>=9.1.4",
    "mcp>=2.2.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.20.0",
    "temporalio>=1.33.0",
    "minio>=7.2.20",
    "fsspec>=2026.9.0",
    "faststream[kafka]>=0.7.6",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "uv>=0.4.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pipdeptree>=2.23.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pylint>=3.2.0",
    "types-pyyaml>=6.0.12.20260906",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/investigation_agent_platform"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "opentelemetry.exporter.otlp.proto.grpc.trace_exporter"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
