# Alembic configuration for investigation-agent-platform (F-069).
#
# Database URL resolution order:
#   1. --x-arg / -x url=<URL> passed on the CLI
#   2. IAP_DATABASE_URI environment variable (production; asyncpg URI)
# Autogeneration compares against src/.../infrastructure/persistence/models.py.

[alembic]
script_location = migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
